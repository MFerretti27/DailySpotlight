name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: dotnet test tests/DailySpotlight.Tests/DailySpotlight.Tests.csproj -c Release
      - run: npm ci
      - run: npm run check && npm test
      - run: dotnet build Jellyfin.Plugin.DailySpotlight/Jellyfin.Plugin.DailySpotlight.csproj -c Release -t:PackagePlugin
      - uses: actions/upload-artifact@v4
        with:
          name: DailySpotlight
          path: artifacts/*.zip